<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" fill="none">
  <!-- BFS Emblem / Ionic Column Mark -->
  <g transform="translate(6, 6)">
    <!-- Circle Boundary -->
    <circle cx="58" cy="58" r="52" stroke="#0B63E5" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    
    <!-- Ionic Capital Header Bar -->
    <rect x="35" y="30" width="46" height="6" rx="2" fill="#0B63E5"/>
    <rect x="29" y="36" width="58" height="5" rx="1.5" fill="#0B63E5"/>
    
    <!-- Volutes (Scrolls) -->
    <path d="M 32 41 C 23 41 22 51 31 52 C 37 53 41 45 37 41" stroke="#0B63E5" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 84 41 C 93 41 94 51 85 52 C 79 53 75 45 79 41" stroke="#0B63E5" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Column Fluting (Vertical Lines) -->
    <line x1="42" y1="44" x2="42" y2="82" stroke="#0B63E5" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="50" y1="44" x2="50" y2="82" stroke="#0B63E5" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="58" y1="44" x2="58" y2="82" stroke="#0B63E5" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="66" y1="44" x2="66" y2="82" stroke="#0B63E5" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="74" y1="44" x2="74" y2="82" stroke="#0B63E5" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Column Base -->
    <rect x="34" y="83" width="48" height="5" rx="1" fill="#0B63E5"/>
    <rect x="29" y="88" width="58" height="6" rx="2" fill="#0B63E5"/>
  </g>

  <!-- Typography BFS ADVOGADOS -->
  <g transform="translate(142, 14)">
    <text x="0" y="56" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">BFS</text>
    <text x="2" y="90" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="18" font-weight="600" fill="#94A3B8" letter-spacing="0.22em">ADVOGADOS</text>
  </g>
</svg>
